/* Nautilus V2. Every class is nx-prefixed (test/v2.css.test.js enforces it). Colours are tokens; the contrast pairs
   are checked in the same test. Mobile first: phone single screen, >=760px inbox + work area, >=1180px adds the map column. */
:root{
  --nx-navy-900:#041628;--nx-navy-800:#0b2342;--nx-navy-700:#16365a;--nx-navy-600:#21486f;
  --nx-silver:#8ea1b8;--nx-on-silver:#06213b;
  --nx-ink:#0b2342;--nx-muted:#4d6177;--nx-page:#eef3f8;--nx-surface:#ffffff;--nx-pale:#e6eff8;
  --nx-line:#d4dfea;--nx-control-line:#7b8ea4;
  --nx-on-navy:#f4f8fc;--nx-on-navy-muted:#b9c9da;--nx-done:#6fdcb4;
  --nx-focus-light:#0b5cad;--nx-focus-dark:#ffcf6e;
  --nx-font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --nx-r-lg:16px;--nx-r-md:12px;--nx-r-sm:8px;
  --nx-shadow:0 1px 0 #fff inset,0 6px 18px rgba(11,35,66,.08);
  --nx-header-h:56px;--nx-focus:var(--nx-focus-light);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.nx-body{margin:0;background:var(--nx-page);color:var(--nx-ink);font:15px/1.5 var(--nx-font)}
.nx-body :focus-visible{outline:3px solid var(--nx-focus);outline-offset:2px}
/* headings that receive focus on navigation (tabindex=-1) are announced, not operated: no ring */
.nx-body [tabindex="-1"]:focus-visible{outline:none}
.nx-dark{--nx-focus:var(--nx-focus-dark)}
.nx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.nx-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.nx-icon{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.nx-work{grid-area:screen;min-width:0;background:var(--nx-surface);outline:none}
.nx-mapcol{display:none}
.nx-foot{grid-area:foot;margin:0;padding:10px 16px 16px;font-size:12px;color:var(--nx-muted);background:var(--nx-page)}
.nx-app[data-screen="inbox"] .nx-work{display:none}
.nx-app[data-screen="ticket"] .nx-inbox{display:none}

/* ---------- inbox ---------- */
.nx-inbox-inner{padding:12px 12px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start}
.nx-list li{min-width:0}
.nx-inbox-h{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 2px;font:700 18px var(--nx-font)}
.nx-count{min-width:26px;height:26px;border-radius:13px;display:inline-grid;place-items:center;background:var(--nx-silver);color:var(--nx-on-silver);font:800 13px var(--nx-font)}
.nx-briefcard{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px;border-radius:var(--nx-r-md);border:1px solid rgba(185,201,218,.45);background:rgba(244,248,252,.08);color:var(--nx-on-navy);font:inherit;cursor:pointer}
.nx-briefcard b{display:block;font-size:14px}.nx-briefcard span{display:block;font-size:13px;color:var(--nx-on-navy-muted)}
.nx-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.nx-item{display:flex;gap:12px;align-items:center;width:100%;min-height:64px;text-align:left;padding:10px;border-radius:var(--nx-r-md);border:1px solid transparent;background:rgba(4,22,40,.55);color:var(--nx-on-navy);font:inherit;cursor:pointer;text-decoration:none}
.nx-item:hover{background:rgba(33,72,111,.6)}
.nx-item[aria-current="page"]{background:var(--nx-navy-600);border-color:var(--nx-silver);box-shadow:inset 4px 0 0 var(--nx-silver)}
.nx-av{width:48px;height:48px;border-radius:50%;flex:0 0 auto;background:var(--nx-navy-700)}
.nx-item-txt .nx-preview{color:var(--nx-on-navy-muted);font-style:italic}
.nx-meta{display:flex!important;flex-wrap:wrap;align-items:center;gap:6px;white-space:normal!important}
/* status: text plus a shape, never colour alone */
.nx-status{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:10px;border:1px solid rgba(185,201,218,.55);font:650 12px/1.5 var(--nx-font);color:var(--nx-on-navy);font-style:normal}
.nx-item-txt .nx-status{display:inline-flex;overflow:visible;white-space:nowrap}
.nx-status::before{content:"";flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--nx-silver)}
.nx-status-progress::before{background:linear-gradient(90deg,var(--nx-focus-dark) 50%,transparent 50%);border:1px solid var(--nx-focus-dark)}
.nx-status-correction::before{border-radius:1px;transform:rotate(45deg);background:var(--nx-focus-dark)}
.nx-status-closed::before{width:9px;height:5px;border-radius:0;background:none;border:solid var(--nx-done);border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.nx-item-txt{min-width:0}.nx-item-txt b{display:block;font-size:15px}.nx-item-txt span{display:block;font-size:13px;color:var(--nx-on-navy-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- ticket workspace ---------- */
.nx-ticket{padding:12px 12px 24px;display:grid;gap:14px;max-width:960px}
.nx-back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 6px;color:var(--nx-ink);font:600 15px var(--nx-font);text-decoration:none;border-radius:var(--nx-r-sm)}
.nx-person{display:flex;gap:14px;align-items:center}
.nx-person .nx-av{width:64px;height:64px}
.nx-person h1{margin:0;font:750 22px/1.2 var(--nx-font);outline:none}
.nx-person p{margin:2px 0 0;color:var(--nx-muted);font-size:14px}
.nx-empty{padding:32px 20px;color:var(--nx-muted);text-align:center}
.nx-h{margin:0 0 10px;font:750 17px var(--nx-font)}
.nx-note{margin:0 0 10px;font-size:14px;color:var(--nx-muted)}
.nx-msg{margin:0;display:grid;gap:10px}
.nx-msg-from{display:flex;align-items:center;gap:10px}.nx-msg-from .nx-av{width:40px;height:40px}
.nx-msg-from b{display:block;font-size:15px}.nx-msg-from span span{display:block;font-size:13px;color:var(--nx-muted)}
.nx-msg-desk{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--nx-navy-800);color:var(--nx-on-navy);flex:0 0 auto}
.nx-bubble{margin:0;padding:12px 14px;border-radius:4px 16px 16px 16px;background:var(--nx-pale);border:1px solid var(--nx-line);font-size:15px;line-height:1.55;max-width:62ch}
.nx-bubble p{margin:0}
.nx-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.nx-chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--nx-control-line);background:var(--nx-surface);color:var(--nx-ink);font:650 14px var(--nx-font);cursor:pointer;box-shadow:0 1px 0 #fff inset,0 2px 6px rgba(11,35,66,.08)}
.nx-chip:hover{background:var(--nx-pale)}
.nx-chip[aria-expanded="true"]{background:var(--nx-navy-800);border-color:var(--nx-navy-800);color:var(--nx-on-navy)}
.nx-rec{margin-top:12px;padding:12px 14px;border-radius:var(--nx-r-md);border:1px solid var(--nx-line);border-left:4px solid var(--nx-navy-800);background:var(--nx-page)}
.nx-rec h3{margin:0 0 6px;font:700 15px var(--nx-font)}.nx-rec p{margin:0;font-size:14px}
.nx-rec dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.nx-rec dt{color:var(--nx-muted)}.nx-rec dd{margin:0}
.nx-tracker{scroll-margin-top:calc(var(--nx-header-h) + 8px)}
.nx-card{background:var(--nx-surface);border:1px solid var(--nx-line);border-radius:var(--nx-r-lg);box-shadow:var(--nx-shadow);padding:16px}
.nx-placeholder{border-style:dashed;color:var(--nx-muted)}
.nx-placeholder h2{margin:0 0 4px;font:700 16px var(--nx-font);color:var(--nx-ink)}
.nx-placeholder p{margin:0;font-size:14px}

/* ---------- tracker: four linked chevrons, a real navigation control ---------- */
.nx-tracker{container:nx-tracker/inline-size;background:var(--nx-navy-800);border-radius:var(--nx-r-lg);padding:12px;color:var(--nx-on-navy);--nx-focus:var(--nx-focus-dark);box-shadow:0 8px 22px rgba(4,22,40,.25)}
.nx-tracker-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px;font:700 12px var(--nx-font);letter-spacing:.12em;text-transform:uppercase;color:var(--nx-on-navy-muted)}
.nx-tracker-h b{color:var(--nx-on-navy);letter-spacing:.08em}
.nx-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.nx-steps li{min-width:0}
.nx-step{position:relative;display:grid;justify-items:center;gap:6px;width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;border-radius:var(--nx-r-sm)}
.nx-chev{display:grid;place-items:center;width:calc(100% + 8px);margin-left:-4px;height:52px;background:var(--nx-navy-700);color:var(--nx-on-navy);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%)}
.nx-steps li:first-child .nx-chev{margin-left:0;width:calc(100% + 4px);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);border-radius:10px 0 0 10px}
.nx-steps li:last-child .nx-chev{width:100%}
.nx-step:hover .nx-chev{background:var(--nx-navy-600)}
.nx-step[aria-current="step"] .nx-chev{background:linear-gradient(180deg,#a9b9cb,var(--nx-silver));color:var(--nx-on-silver)}
.nx-step-num{display:none;font:800 18px var(--nx-font)}
.nx-step-done{position:absolute;top:4px;right:18px;width:18px;height:18px;border-radius:50%;background:var(--nx-done);color:var(--nx-navy-900);display:grid;place-items:center}
.nx-step-done svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.nx-step-label{font:600 13px/1.2 var(--nx-font);color:var(--nx-on-navy);text-align:center;max-width:100%;overflow-wrap:anywhere}
.nx-step[aria-current="step"] .nx-step-label{font-weight:800}
.nx-instr{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:var(--nx-r-md);background:var(--nx-pale);color:var(--nx-ink)}
.nx-instr .nx-icon{width:28px;height:28px;color:var(--nx-navy-800);margin-top:2px}
.nx-instr h2{margin:0;font:750 17px/1.25 var(--nx-font)}
.nx-instr p{margin:2px 0 0;font-size:14px;color:var(--nx-muted)}
/* narrow tracker: number or tick inside each chevron; the selected stage's full label is the instruction heading below */
@container nx-tracker (max-width:330px){
  .nx-step-label,.nx-chev .nx-icon{display:none}
  .nx-step-num{display:block}
  .nx-step .nx-step-done{position:static;width:24px;height:24px}
  .nx-step:has(.nx-step-done) .nx-step-num{display:none}
}

/* ---------- map region (one instance; column on wide screens, dialog otherwise) ---------- */
.nx-map{display:grid;gap:10px;color:var(--nx-on-navy)}
.nx-map-bar{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 8px}
.nx-map-bar h2{flex:1;margin:0;font:700 17px var(--nx-font);outline:none}
.nx-map-ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:0 8px}
.nx-seg{display:inline-flex;gap:4px;padding:3px;border-radius:var(--nx-r-md);background:rgba(4,22,40,.6);border:1px solid rgba(185,201,218,.45)}
.nx-seg button{position:relative;min-height:44px;min-width:44px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--nx-on-navy);font:700 14px var(--nx-font);cursor:pointer;white-space:nowrap}
.nx-seg button span{font-weight:500;color:var(--nx-on-navy-muted)}
.nx-seg button[aria-pressed="true"]{background:var(--nx-silver);color:var(--nx-on-silver)}.nx-seg button[aria-pressed="true"] span{color:var(--nx-on-silver)}
.nx-seg button.nx-lit::after{content:"";position:absolute;top:7px;right:5px;width:7px;height:7px;border-radius:50%;background:#a4ead0}
.nx-clock{font:700 13px var(--nx-font);letter-spacing:.04em;color:#ffd994}
.nx-map-fig{margin:0 8px;display:block}
.nx-map-fig .nx-map-cap{margin-top:8px}
.nx-map-svg{display:block;width:100%;height:auto;aspect-ratio:4/3;border-radius:var(--nx-r-md);background:#061b29}
.nx-map-cap{font-size:13px;line-height:1.45;color:var(--nx-on-navy-muted)}
.nx-legend{list-style:none;margin:0;padding:0 8px 8px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--nx-on-navy-muted)}
.nx-legend li{display:flex;align-items:center;gap:6px}
.nx-sw{width:16px;height:16px;flex:0 0 auto}
.nx-close{min-width:44px;min-height:44px;border-radius:var(--nx-r-md);border:1px solid rgba(185,201,218,.55);background:rgba(11,35,66,.55);color:var(--nx-on-navy);font:600 14px var(--nx-font);cursor:pointer;padding:0 12px}

/* ---------- dialogs ---------- */
.nx-dialog{border:0;padding:0;max-width:none;max-height:none;color:var(--nx-ink)}
.nx-dialog::backdrop{background:rgba(2,12,22,.7)}
.nx-brief-dlg{width:min(92vw,560px);border-radius:var(--nx-r-lg);background:var(--nx-surface);box-shadow:0 20px 50px rgba(2,12,22,.5)}
.nx-brief{padding:20px;display:grid;gap:10px}
.nx-brief h2{margin:0;font:750 19px var(--nx-font);outline:none}
.nx-brief p{margin:0;font-size:15px}.nx-brief .nx-note{color:var(--nx-muted);font-size:14px}
.nx-btn{justify-self:start;min-height:44px;padding:0 18px;border-radius:var(--nx-r-md);border:1px solid var(--nx-navy-800);background:var(--nx-navy-800);color:var(--nx-on-navy);font:650 15px var(--nx-font);cursor:pointer}
.nx-map-dlg{width:100vw;height:100dvh;margin:0;inset:0;background:var(--nx-navy-900);--nx-focus:var(--nx-focus-dark)}
.nx-map-dlg .nx-map{height:100%;align-content:start;overflow-y:auto;padding-bottom:12px}
.nx-map-dlg .nx-map-svg{max-width:calc((100dvh - 190px) * 4 / 3);margin:0 auto}

@media (min-width:760px){
  :root{--nx-header-h:64px}
  .nx-app{grid-template-columns:300px minmax(0,1fr);grid-template-areas:"header header" "inbox screen" "foot foot"}
  .nx-inbox{grid-area:inbox;display:block}
  .nx-app[data-screen="ticket"] .nx-inbox,.nx-app[data-screen="inbox"] .nx-work{display:block}
  .nx-brand-lockup{height:50px;width:calc(50px*465/142)}
  .nx-hbtn-label{position:static;width:auto;height:auto;overflow:visible;clip-path:none}
  .nx-hbtn{padding:0 14px}
  .nx-ticket{padding:20px 24px 32px}
  .nx-back{display:none}
}
@media (min-width:1180px){
  .nx-app{grid-template-columns:300px minmax(0,1fr) 380px;grid-template-areas:"header header header" "inbox screen mapcol" "foot foot foot"}
  .nx-mapcol{grid-area:mapcol;display:block;background:var(--nx-navy-800);--nx-focus:var(--nx-focus-dark)}
  .nx-mapcol .nx-map{position:sticky;top:var(--nx-header-h);padding:8px 0 16px}
}
@media (max-width:299px){.nx-brand-lockup{display:none}.nx-brand-mark{display:block}}
@media (prefers-reduced-motion:reduce){.nx-body *{transition:none!important;animation:none!important}}
@media (forced-colors:active){.nx-step[aria-current="step"] .nx-chev{outline:3px solid CanvasText}.nx-item[aria-current="page"]{outline:2px solid CanvasText}}
.nx-instr-na{font-weight:500;font-size:14px;color:var(--nx-muted)}

</style>
</head>

  const DOORS = {

  function groupHours(world, g) { return (world.groupOverrides && world.groupOverrides[g]) || GROUPS[g].hours; }
  // Effective grants ignoring time: door -> [{via, kind, window}]
  function grants(world, person) {
    const out = {};
    if (!person.credential.active) return out;
    for (const g of person.credential.groups) for (const d of GROUPS[g].doors)
      (out[d] = out[d] || []).push({ via: GROUPS[g].n, group: g, kind: 'group', window: groupHours(world, g), inherited: GROUPS[g].inherited && GROUPS[g].inherited[d] });
    for (const x of person.credential.exceptions || []) for (const d of x.doors)
      (out[d] = out[d] || []).push({ via: `Exception · ${x.source}`, kind: 'exception', window: x.window, day: x.day, date: x.date });
    return out;
  }
  // Can this person enter through this door at time t? Returns full evidence; the UI decides what to show.
  function canEnter(world, person, doorId, t) {
    const door = DOORS[doorId];
    if (!door) return { ok: false, code: 'NO_DOOR' };
    const status = (world.doorStatus && world.doorStatus[doorId]) || 'online';
    if (!person.credential.active) return { ok: false, code: 'CREDENTIAL_INACTIVE', status };
    const g = grants(world, person)[doorId] || [];
    if (!g.length) return { ok: false, code: 'NO_GRANT', status, grants: g };

/* Nautilus workflow logic, shared by the V1 and V2 interfaces: pure functions of (scenario, ticket state).
   Grading, workflow landmarks, walk construction and outcome records. No DOM, no view state.
   Extracted unchanged from src/ui.html (Phase 01a); test/flow.test.js holds it to the recorded baseline. */
const Flow = (() => {
const E = typeof Engine !== 'undefined' ? Engine : require('./engine.js');
const routeOf=(sc,t)=>{const r=sc.routes;return r?(r.find(x=>x.id===t.route)||r[0]):null;};
const actorOf=(sc,t)=>{const r=routeOf(sc,t);return r&&r.as==='escort'?sc.escort:t.person;};
const center=id=>{const s=E.SPACES[id];if(s.ellipse)return[s.ellipse[0],s.ellipse[1]];const r=s.r[0];return[r[0]+r[2]/2,r[1]+r[3]/2];};
const outP=id=>E.OUTSIDE[id].p;
const finalized=t=>!!(t.result&&(t.result.cls==='good'||t.result.final));
const verified=(sc,t)=>{const r=routeOf(sc,t);return !!(t.walk&&!t.walk.running&&!t.walk.res.stop&&t.walk.routeId===(r?r.id:null));};

function steps(sc,t){const g=sc.goal||'reach',r=routeOf(sc,t),c=t.person.credential;
  const seen=!!(t.delta||t.disp||t.walk||t.sel||Object.values(t.open).some(Boolean)||(sc.routes&&t.route!==sc.routes[0].id)),closed=finalized(t);
  if(g==='audit')return[['review','Review',seen],['investigate','Investigate',!!t.sel||Object.values(t.open).some(Boolean)],['decide','Decide',!!t.disp&&!c.active],['close','Submit',closed]];
  if(g==='adapt')return[['review','Review',seen],['respond','Respond',!!(sc.routes&&t.route!==sc.routes[0].id)],['verify',r&&r.wait?'Verify (n/a)':'Verify',verified(sc,t)||!!(r&&r.wait)],['close','Record',closed]];
  return[['review','Review',seen],['configure','Configure',!!t.delta],['verify','Verify',verified(sc,t)],['close','Close',closed]];}
/* walk: the evaluator's result plus the points the map animates through */
function buildWalk(sc,t){const r=routeOf(sc,t),actor=actorOf(sc,t),from=(r&&r.start)||sc.start,who=r&&r.as==='escort'?sc.escort.name.split(' ')[0]:null,res=E.walk(t.world,actor,from,sc.targets,sc.time);
  const pts=[{x:outP(sc.start)[0],y:outP(sc.start)[1],l:1}];
  if(from!==sc.start){const a=outP(sc.start),b=outP(from);pts.push({x:a[0],y:298,l:1},{x:b[0],y:298,l:1,transfer:true,label:`${E.OUTSIDE[sc.start].n.replace('Outside · ','')} to ${E.OUTSIDE[from].n.replace('Outside · ','')}, outside the building`});}
  for(const s of res.steps){const l=s.door?E.doorLevel(s.door):s.p?E.levelOf(s.to):E.levelOf(s.to);
    if(s.door&&!s.exit){const [x,y]=E.DOORS[s.door].p;pts.push({x,y,l:E.doorLevel(s.door),door:s.door,ok:s.result.ok,who});if(!s.result.ok)break;}
    else if(s.p){pts.push({x:s.p[0],y:s.p[1],l:E.levelOf(s.from)});}
    const [cx,cy]=center(s.to),arr=sc.targets.includes(s.to)&&!pts.some(p=>p.arrive===s.to);pts.push({x:cx,y:cy,l:E.levelOf(s.to),...(arr?{arrive:s.to}:{})});}

function grade(sc,t){const res=E.walk(t.world,t.person,sc.start,sc.targets,sc.time),extra=E.outOfScope(t.world,t.person).map(d=>E.DOORS[d].n);

  {const r=routeOf(sc,t);
    if(sc.verify&&sc.goal!=='audit'&&!(r&&r.wait)&&!(t.walk&&!t.walk.running&&t.walk.routeId===(r?r.id:null)))
      return{cls:'badr',title:'Not ready to close',text:`Walk ${who} in${r?' by this route':''} to confirm it works from their side before closing the ticket.`};}
  if(sc.goal==='adapt'){const r=routeOf(sc,t),escort=r.as==='escort',own=r.as==='self'&&r.start!==sc.start,first=sc.escort?sc.escort.name.split(' ')[0]:'';
    // 1. route outcome (a wait route has no walk)

      if(wr.stop)return{cls:'badr',title:'Not ready to close',text:`At ${sc.day} ${E.fmt(sc.time)}, ${escort?first+' and '+who:who} would be stopped at ${E.DOORS[wr.stop.door]?E.DOORS[wr.stop.door].n:'a door'}. Walk the route and inspect where it fails.`};}

const NxMap = ((E, F) => {
  const shapes = (id, attrs = '') => E.SPACES[id].r.map(r => `<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" ${attrs}/>`).join('');
  function label(id) {
    const s = E.SPACES[id], [x, y] = F.center(id), r = s.r[0];
    if (r[2] < 46 && r[3] > r[2] * 2) return `<text x="${x}" y="${y}" class="nx-lbl nx-lbl-sm" transform="rotate(-90 ${x} ${y})">${s.n.toUpperCase()}</text>`;
    if (r[2] < 46) return `<text x="${x}" y="${y + 3}" class="nx-lbl nx-lbl-sm">${(s.short || s.n).toUpperCase()}</text>`;
    const narrow = r[2] < 70, cls = narrow ? 'nx-lbl nx-lbl-nr' : 'nx-lbl', words = s.n.toUpperCase().split(' ');
    const lines = words.length > 1 && (s.n.length > 11 || narrow) ? [words.slice(0, Math.ceil(words.length / 2)).join(' '), words.slice(Math.ceil(words.length / 2)).join(' ')] : [s.n.toUpperCase()];
    return lines.map((t, i) => `<text x="${x}" y="${y + 4 + (i - (lines.length - 1) / 2) * 12}" class="${cls}">${t}</text>`).join('');
  }

    <pattern id="nxHatch${sfx}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#0a2a38"/><rect width="1.5" height="6" fill="#1d4d5e"/></pattern>
    <pattern id="nxDots${sfx}" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.1" fill="#d9fff1" opacity=".6"/></pattern>
    <pattern id="nxStrp${sfx}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="6" fill="#ffe3b3" opacity=".45"/></pattern>
    <filter id="nxRing${sfx}" x="-5%" y="-5%" width="110%" height="110%"><feMorphology in="SourceGraphic" operator="dilate" radius="1.8" result="d"/><feComposite in="d" in2="SourceAlpha" operator="out"/></filter>`;
  const style = font => `<style>.nx-lbl{fill:#e3f5f6;font:700 11.5px ${font};text-anchor:middle;letter-spacing:.04em;pointer-events:none}.nx-lbl-sm{font-size:9.5px;fill:#bfe0e5}.nx-lbl-nr{font-size:10px}
    .nx-lbl-void{font-size:9px;fill:#7fa9b3;font-weight:600}.nx-lbl-out{font-size:9px;fill:#a4ead0}</style>`;
  const footprintOf = t => t ? E.footprint(t.world, t.person) : { spaces: new Set(), doors: new Set() };
  /* one level: spaces, labels, the dark-water veil with the granted footprint cut out, public/restricted patterns, doors */
  function level(t, l, sfx) {
    const fp = footprintOf(t), ids = Object.keys(E.SPACES).filter(k => E.SPACES[k].l === l), lit = [...fp.spaces].filter(k => E.SPACES[k].l === l);
    let s = `<rect x="4" y="4" width="392" height="292" rx="10" fill="#082536" stroke="#3a7487" stroke-width="1.5"/>`;
    for (const id of ids) { const k = E.SPACES[id].kind;
      s += shapes(id, `fill="${k === 'public' ? '#12445a' : k === 'program' ? '#13495c' : k === 'core' ? '#1f4b5c' : k === 'restricted' ? '#2a3a4a' : '#163a47'}" stroke="#4d8696" stroke-width="1"`);
      if (E.SPACES[id].ellipse) { const [cx, cy, rx, ry] = E.SPACES[id].ellipse; s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#nxWater${sfx})" stroke="#61c8d6" stroke-width="1.5"/>`; } }
    if (l === 2) { for (const v of E.VOIDS) s += `<rect x="${v.r[0]}" y="${v.r[1]}" width="${v.r[2]}" height="${v.r[3]}" fill="url(#nxHatch${sfx})" stroke="#2c5a69" stroke-dasharray="3 3"/><text x="${v.r[0] + v.r[2] / 2}" y="${v.r[1] + v.r[3] / 2 + 3}" class="nx-lbl nx-lbl-void">${v.n.toUpperCase()}</text>`;
      s += `<g stroke="#d4bb8c" stroke-width="3" opacity=".55"><path d="M210 70H284M210 110H284M210 150H284M210 185H284M226 52V196M262 52V196"/></g>`; }
    for (const id of ids) s += label(id);
    s += `<mask id="nxVeil${sfx}"><rect width="400" height="300" fill="#fff"/>${lit.map(k => shapes(k, 'fill="#000"')).join('')}</mask><rect width="400" height="300" fill="#021019" opacity=".72" mask="url(#nxVeil${sfx})"/>`;
    s += `<g filter="url(#nxRing${sfx})">${lit.map(k => shapes(k, 'fill="#a4ead0"')).join('')}</g>`;
    for (const k of lit) { const kd = E.SPACES[k].kind; if (kd === 'public' || kd === 'restricted') s += shapes(k, `fill="url(#${kd === 'public' ? 'nxDots' : 'nxStrp'}${sfx})" pointer-events="none"`); }

    if (l === 1) s += `<path d="M24 296h16M390 242v16" stroke="#a4ead0" stroke-width="3"/><text x="44" y="297" class="nx-lbl nx-lbl-out" style="text-anchor:start">STAFF ENTRANCE</text><text x="383" y="236" class="nx-lbl nx-lbl-out" style="text-anchor:end">DOCK</text>`;

/* ---------- derived ---------- */
const stagesOf=id=>F.steps(S[id],st[id]).map(([key,label,done])=>({key,label:label.replace(' (n/a)',''),na:/\(n\/a\)/.test(label),done}));

/* ---------- routing: #/inbox, #/t/<id>/<stage>, either with /map ---------- */
function parse(h){const p=h.replace(/^#\/?/,'').split('/').filter(Boolean),map=p[p.length-1]==='map';if(map)p.pop();
  if(p[0]==='t'&&S[p[1]]){const ss=stagesOf(p[1]),stage=ss.some(s=>s.key===p[2])?p[2]:(view[p[1]].stage||ss[0].key);return{screen:'ticket',id:p[1],stage,map};}
  return{screen:'inbox',id:null,stage:null,map};}
const hashOf=r=>(r.screen==='ticket'?`#/t/${r.id}/${r.stage}`:'#/inbox')+(r.map?'/map':'');
function go(r,{replace=false}={}){const s={nx:true,from:route.screen,map:!!r.map&&!route.map};
  replace?history.replaceState({...(history.state||{}),nx:true},'',hashOf(r)):history.pushState(s,'',hashOf(r));onRoute();}
function onRoute(){const prev=route;route=parse(location.hash);
  if(route.screen==='ticket')view[route.id].stage=route.stage;
  if(hashOf(route)!==location.hash)history.replaceState(history.state,'',hashOf(route));
  render();placeMap();
  if(route.screen!==prev.screen||route.id!==prev.id){
    if(route.screen==='ticket'){const h=document.querySelector('.nx-person h1');h&&h.focus({preventScroll:true});scrollTo(0,0);}
    else if(prev.id){const a=document.querySelector(`[data-nx-key="inbox-${prev.id}"]`);a&&a.focus({preventScroll:true});}}
  else if(route.stage!==prev.stage&&route.screen==='ticket'){const ss=stagesOf(route.id),i=Math.max(0,ss.findIndex(x=>x.key===route.stage)),s=ss[i];announce(`Step ${i+1} of 4: ${s.label}${s.na?', not applicable':''}`);}}
/* walk guard (Phase 05: navigation away from a running walk asks Cancel walk / Continue test; nothing can run a walk yet) */
const leaveOK=()=>true;
function backToInbox(){if(!leaveOK())return;history.state&&history.state.nx&&history.state.from==='inbox'&&!route.map?history.back():go({screen:'inbox',map:false});}
function openMap(){invoker=document.activeElement;if(isWide()){const h=inMap('#nxMapH');h.scrollIntoView({block:'nearest'});h.focus({preventScroll:true});return;}go({...route,map:true});}
function closeMap(){history.state&&history.state.map?history.back():go({...route,map:false},{replace:true});}

/* ---------- render (focus is restored by data-nx-key after every update) ---------- */

  $('nxApp').dataset.screen=route.screen;renderInbox();renderWork();renderMap();
  if(k){const el=document.querySelector(`[data-nx-key="${k}"]`);if(el&&el!==document.activeElement)el.focus({preventScroll:true});}}
function renderInbox(){const open=ORDER.filter(id=>statusOf(id)!=='closed').length;
  $('nxInbox').innerHTML=`<div class="nx-inbox-inner"><h2 class="nx-inbox-h" id="nxInboxH">Shift Inbox <span class="nx-count" aria-label="${open} open">${open}</span></h2>
    <button class="nx-briefcard" type="button" data-nx-key="briefcard" data-nx-act="brief">${icon('review')}<span><b>Shift brief</b> <span>From the ops desk supervisor · how today's tickets work</span></span></button>
    <ul class="nx-list">${ORDER.map(id=>{const sc=S[id],p=sc.person,cur=route.screen==='ticket'&&route.id===id,stt=statusOf(id);
      return `<li><a class="nx-item" href="${hashOf({screen:'ticket',id,stage:stageOf(id).key})}" data-nx-key="inbox-${id}" data-nx-open="${id}"${cur?' aria-current="page"':''}>
        <img class="nx-av" src="${AVATAR[id]}" alt="" width="48" height="48"><span class="nx-item-txt"><b>${esc(p.name)}</b> <span>${ROLE[id]}</span> <span class="nx-preview">${esc(sc.message)}</span>
        <span class="nx-meta">${esc(refOf(sc))} · ${esc(sc.day)} ${E.fmt(sc.time)} <span class="nx-status nx-status-${stt}">${STATUS[stt]}</span></span></span></a></li>`;}).join('')}</ul></div>`;}
function renderWork(){const w=$('nxWork');
  if(route.screen!=='ticket'){w.innerHTML=`<div class="nx-empty"><p>Select a request from the Shift Inbox.</p></div>`;return;}
  const id=route.id,sc=S[id],p=sc.person,ss=stagesOf(id),i=Math.max(0,ss.findIndex(s=>s.key===view[id].stage)),cur=ss[i],next=ss[i+1],sug=ss.find(s=>!s.done);

  w.innerHTML=`<div class="nx-ticket">

    <section class="nx-tracker" aria-labelledby="nxTrackerH">
      <div class="nx-tracker-h"><span id="nxTrackerH">Request progress</span><b aria-hidden="true">${String(i+1).padStart(2,'0')} of 04</b></div>
      <ol class="nx-steps">${ss.map((s,j)=>`<li><button class="nx-step" type="button" data-nx-key="step-${j}" data-nx-step="${s.key}"${s===cur?' aria-current="step"':''}
          aria-label="Step ${j+1} of 4: ${esc(s.label)}${s.na?', not applicable':''}${s.done?', done':''}${s===sug&&s!==cur?', suggested next':''}">
          <span class="nx-chev">${icon(s.key)}<span class="nx-step-num" aria-hidden="true">${j+1}</span>${s.done?`<span class="nx-step-done" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2.5 6.5l2.2 2.2 4.8-5"/></svg></span>`:''}</span>
          <span class="nx-step-label" aria-hidden="true">${esc(s.label)}</span></button></li>`).join('')}</ol>
      <div class="nx-instr">${icon(cur.key)}<div><h2 tabindex="-1">${esc(cur.label)}${cur.na?' <span class="nx-instr-na">(not applicable on this route)</span>':''}</h2>${sc.coach&&sc.coach[cur.key]?`<p>${esc(sc.coach[cur.key])}</p>`:''}</div></div>
    </section>
    <div class="nx-stage" id="nxStage" data-stage="${cur.key}" data-slot="${i}">${(STAGE_VIEW[i]||placeholderHTML)(id,cur,PH[i])}</div>
    ${next?`<button class="nx-btn" type="button" data-nx-key="next" data-nx-next="${next.key}">Next: ${esc(next.label)}</button>`:''}
  </div>`;}
/* Review: the request in its sender's words, then the records and notes the ticket links (disclosures; reading one is work
   recorded on the ticket, as in V1). Only legitimate records appear here: denial causes stay with inspection. */
function reviewHTML(id){const sc=S[id],p=sc.person,t=st[id],snd=SENDER[id];
  const recs=[...p.authorizations.map(a=>({id:a.id,title:`${a.id} · ${a.purpose}`,rows:[['Covers',a.places],['When',a.window],['Approved by',a.approver]]})),
    ...(sc.notes||[]).map(n=>({id:n.id,title:n.id,text:n.text}))];
  const key=r=>r.id.replace(/[^A-Za-z0-9]+/g,'-');
  return `<section class="nx-card nx-request" aria-labelledby="nxReqH"><h2 id="nxReqH" class="nx-h">Request</h2>
      <figure class="nx-msg"><figcaption class="nx-msg-from">${snd?`<span class="nx-msg-desk" aria-hidden="true">${icon('review')}</span><span><b>${esc(snd.name)}</b> <span>${esc(snd.note)} · about ${esc(p.name)}</span></span>`
        :`<img class="nx-av" src="${AVATAR[id]}" alt="" width="40" height="40"><span><b>${esc(p.name)}</b> <span>${ROLE[id]}</span></span>`}</figcaption>
        <blockquote class="nx-bubble"><p>${esc(sc.message)}</p></blockquote></figure></section>
    <section class="nx-card nx-records" aria-labelledby="nxRecH"><h2 id="nxRecH" class="nx-h">Records</h2><p class="nx-note">Open a record to read it.</p>
      <ul class="nx-chips">${recs.map(r=>`<li><button class="nx-chip" type="button" data-nx-key="rec-${key(r)}" data-nx-rec="${esc(r.id)}" aria-expanded="${!!t.open[r.id]}" aria-controls="nxRec-${key(r)}">${esc(r.id)}</button></li>`).join('')}</ul>
      ${recs.map(r=>`<div class="nx-rec" id="nxRec-${key(r)}" role="region" aria-label="${esc(r.title)}"${t.open[r.id]?'':' hidden'}><h3>${esc(r.title)}</h3>${r.text?`<p>${esc(r.text)}</p>`
        :`<dl>${r.rows.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`}</div>`).join('')}</section>`;}
/* stage container: one renderer per tracker slot. Slots 2-4 (Configure/Investigate/Respond, Verify/Decide, Close/Submit/Record)
   stay labelled placeholders until Phases 04-06 give them workspaces. */
const placeholderHTML=(id,cur,ph)=>`<section class="nx-card nx-placeholder" aria-labelledby="nxPhH"><h2 id="nxPhH">${esc(cur.label)} workspace</h2><p>Not built yet: this stage's workspace arrives in ${ph}. The Review stage, the tracker and the map are live.</p></section>`;
const STAGE_VIEW={0:id=>reviewHTML(id)};
function announce(t){const l=$('nxLive');l.textContent='';setTimeout(()=>l.textContent=t,30);}

/* ---------- map region: one element, column on wide screens, full-screen dialog otherwise ---------- */
const mapRegion=document.createElement('section');mapRegion.className='nx-map';const inMap=sel=>mapRegion.querySelector(sel);
const sw=(fill,extra='')=>`<svg class="nx-sw" viewBox="0 0 16 16" aria-hidden="true">${fill}${extra}</svg>`;
mapRegion.innerHTML=`<div class="nx-map-bar"><h2 id="nxMapH" tabindex="-1">Facility map</h2><button class="nx-close" type="button" id="nxMapClose" data-nx-key="mapclose">Close map</button></div>
  <div class="nx-map-ctl"><div class="nx-seg" role="group" aria-label="Level"><button type="button" id="nxLv1" data-nx-key="lv1" data-nx-level="1">L1 <span>Gallery</span></button><button type="button" id="nxLv2" data-nx-key="lv2" data-nx-level="2">L2 <span>Topside</span></button></div>
    <span class="nx-clock" id="nxClock"></span></div>
  <figure class="nx-map-fig"><svg class="nx-map-svg" id="nxMapSvg" viewBox="0 0 400 300" role="img" aria-labelledby="nxMapCap"></svg>
    <figcaption class="nx-map-cap" id="nxMapCap"></figcaption></figure>
  <ul class="nx-legend" aria-label="Map key">
    <li>${sw('<rect x="1" y="3" width="14" height="10" rx="2" fill="#a4ead0"/>')}Area the badge reaches</li>
    <li>${sw('<rect x="1" y="3" width="14" height="10" rx="2" fill="#a4ead0"/><circle cx="5" cy="8" r="1.4" fill="#0b2a39"/><circle cx="11" cy="8" r="1.4" fill="#0b2a39"/>')}Public gallery</li>
    <li>${sw('<rect x="1" y="3" width="14" height="10" rx="2" fill="#a4ead0"/><path d="M3 13l6-10M8 13l6-10" stroke="#0b2a39" stroke-width="1.5"/>')}Restricted area</li>
    <li>${sw('<circle cx="8" cy="8" r="5" fill="#a4ead0" stroke="#a9cfd6"/>')}Door the badge opens</li>
    <li>${sw('<circle cx="8" cy="8" r="5" fill="#0b2a39" stroke="#a9cfd6" stroke-width="1.3"/>')}Other door with a reader</li></ul>`;
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const list=a=>a.length?a.join(', '):'none';
/* the map shows the open ticket's badge (granted only) at that ticket's level; in the inbox, the plain floor plan */
function renderMap(){const id=route.screen==='ticket'?route.id:null,t=id?st[id]:null,sc=id?S[id]:null,l=id?view[id].level:inboxLevel;
  inMap('#nxMapSvg').innerHTML=NxMap.svg(t,l,getComputedStyle(document.body).fontFamily);
  const l2=t&&NxMap.litOn(t,2);
  inMap('#nxLv1').setAttribute('aria-pressed',l===1);inMap('#nxLv2').setAttribute('aria-pressed',l===2);
  inMap('#nxLv1').setAttribute('aria-label','Level 1, Gallery');inMap('#nxLv2').setAttribute('aria-label',`Level 2, Topside${l2?', has areas the badge reaches':''}`);
  inMap('#nxLv2').classList.toggle('nx-lit',!!l2&&l!==2);
  inMap('#nxClock').textContent=sc?`${sc.day} ${MONTHS[+sc.date.slice(5,7)-1]} ${+sc.date.slice(8)} · ${E.fmt(sc.time)}`:'';
  const s=NxMap.summary(t);
  inMap('#nxMapCap').textContent=t?`Showing level ${l}. ${sc.person.name}'s badge opens ${s.doors.length} door${s.doors.length===1?'':'s'}: ${list(s.doors)}. Areas it reaches, level 1: ${list(s.l1)}; level 2: ${list(s.l2)}.`
    :`Showing level ${l}. Open a ticket to see what that badge opens.`;}
mapRegion.addEventListener('click',e=>{const b=e.target.closest('[data-nx-level]');if(!b)return;const l=+b.dataset.nxLevel;
  if(route.screen==='ticket')view[route.id].level=l;else inboxLevel=l;renderMap();announce(`Level ${l}`);});
function placeMap(){const dlg=$('nxMapDlg');
  if(isWide()){if(dlg.open)dlg.close();$('nxMapCol').appendChild(mapRegion);inMap('#nxMapClose').hidden=true;return;}
  inMap('#nxMapClose').hidden=false;
  if(mapRegion.parentNode!==dlg)dlg.appendChild(mapRegion);/* always in the document: inside the closed dialog when not shown */
  if(route.map){if(!dlg.open){dlg.showModal();inMap('#nxMapH').focus();}}
  else if(dlg.open){dlg.close();const t=invoker&&document.contains(invoker)?invoker:$('nxMapBtn');t.focus({preventScroll:true});}}
$('nxMapDlg').addEventListener('cancel',e=>{e.preventDefault();closeMap();});
mapRegion.addEventListener('click',e=>{if(e.target.closest('#nxMapClose'))closeMap();});
matchMedia('(min-width:1180px)').addEventListener('change',placeMap);

/* ---------- shift brief ---------- */
function openBrief(){const d=$('nxBrief');invoker=document.activeElement;
  d.innerHTML=`<div class="nx-brief"><h2 id="nxBriefH" tabindex="-1">Shift brief</h2>
    <p>Morning. Four access tickets today. For each one: read the request and its records, inspect anything that doesn't add up, and decide what to change. When you change someone's access, walk them in to check it works from their side before you close the ticket.</p>
    <p class="nx-note">On the map, lit areas are where a badge is granted (dotted ones are public galleries, striped ones restricted) and the small circles are doors with readers. A door opens into an area, and open passages join areas, so one door can light several rooms. Topside (L2) sits above the galleries.</p>
    <button class="nx-btn" type="button" id="nxBriefClose">Close brief</button></div>`;
  d.showModal();$('nxBriefH').focus();}
function closeBrief(){const d=$('nxBrief');d.close();const t=invoker&&document.contains(invoker)?invoker:$('nxBriefBtn');t.focus({preventScroll:true});}
$('nxBrief').addEventListener('cancel',e=>{e.preventDefault();closeBrief();});
$('nxBrief').addEventListener('click',e=>{if(e.target.id==='nxBriefClose'||e.target===$('nxBrief'))closeBrief();});

/* ---------- events ---------- */
$('nxBriefBtn').onclick=openBrief;$('nxMapBtn').onclick=openMap;
document.querySelector('.nx-brand').addEventListener('click',e=>{e.preventDefault();if(route.screen!=='inbox')backToInbox();});
document.addEventListener('click',e=>{const a=e.target.closest('[data-nx-open],[data-nx-step],[data-nx-next],[data-nx-act],[data-nx-rec]');if(!a)return;
  if(a.dataset.nxOpen){e.preventDefault();if(!leaveOK())return;const id=a.dataset.nxOpen;go({screen:'ticket',id,stage:stageOf(id).key,map:false});}
  else if(a.dataset.nxStep){go({...route,stage:a.dataset.nxStep},{replace:true});}
  /* Next starts the learner at the top of the new stage: focus its heading, bring the tracker into view (chevrons keep focus) */
  else if(a.dataset.nxNext){go({...route,stage:a.dataset.nxNext},{replace:true});const h=document.querySelector('.nx-instr h2');
    document.querySelector('.nx-tracker').scrollIntoView({block:'start'});h.focus({preventScroll:true});}
  /* reading a record is a domain action (as in V1): it is recorded on the ticket and counts toward Review/Investigate */
  else if(a.dataset.nxRec){const t=st[route.id],k=a.dataset.nxRec;t.open[k]=!t.open[k];if(t.open[k])t.read[k]=true;render();}
  else if(a.dataset.nxAct==='inbox'){e.preventDefault();backToInbox();}
  else if(a.dataset.nxAct==='brief')openBrief();});
/* arrow keys move between the four stages; Enter or Space selects */
document.addEventListener('keydown',e=>{const b=e.target.closest&&e.target.closest('.nx-step');if(!b)return;
  const all=[...document.querySelectorAll('.nx-step')],i=all.indexOf(b),j={ArrowLeft:i-1,ArrowRight:i+1,Home:0,End:all.length-1}[e.key];
  if(j==null||j<0||j>=all.length)return;e.preventDefault();all[j].focus();});
addEventListener('popstate',onRoute);addEventListener('hashchange',()=>{if(hashOf(parse(location.hash))!==hashOf(route))onRoute();});
/* read-only hook for the browser tests: evaluation results must not change with navigation */
window.__nx={grade:id=>F.grade(S[id],st[id]),steps:id=>F.steps(S[id],st[id]),status:id=>F.status(S[id],st[id]),view:()=>JSON.parse(JSON.stringify({route,view})),
  footprint:id=>{const f=E.footprint(st[id].world,st[id].person);return{doors:[...f.doors].sort(),spaces:[...f.spaces].sort()};}};
history.replaceState({nx:true,from:null},'',location.hash||'#/inbox');onRoute();
})();

</script>
</body>
</html>
